<style>
/* Layout: one quiet page. A centred 720px plate (title, line, scene, topic pills, install) above a 1040px grid of every example that opens into a stepping viewer. Light only on purpose: the scenes are ink on white paper. */
:root {

* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.plate { width: min(720px, 100%); margin: 0 auto; padding-block: 112px 0; display: grid; justify-items: center; text-align: center; }
.plate h1 { font: 600 22px var(--mono); letter-spacing: -.02em; }

.slide.out-l { opacity: 0; transform: translateX(-18px); }

<script>

<script>
const CATALOG = window.CATALOG;
const PROMPTS = window.PROMPTS;
const byId = Object.fromEntries(CATALOG.map((s) => [s.id, s]));
const catName = Object.fromEntries(window.CATEGORIES.map((c) => [c.id, c.name]));
const INSTALL = 'npx skills add nilbuild/stick-scene';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const promptFor = (id) => PROMPTS[id] || `show ${byId[id].title.toLowerCase()}`;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function sc(id, play) {
  const el = document.createElement('stick-scene');
  el.setAttribute('scene', id);
  el.setAttribute('play', play || 'click');
  el.setAttribute('no-floor', '');
  el.setAttribute('aria-label', `${byId[id].title}: ${byId[id].blurb}`);
  return el;
}
function whenView(el, cb, n) {
  if (!el.isConnected) {
    return;
  }
  if (el.v) {
    cb(el.v);
    return;
  }
  if ((n || 0) > 900) {
    return;
  }
  requestAnimationFrame(() => whenView(el, cb, (n || 0) + 1));
}
function playOnce(el) {
  return new Promise((res) => {
    whenView(el, (v) => {
      v.on = false;
      v.paused = false;
      v.play();
      const wait = () => {
        if (!el.isConnected || !v.on) {
          res();
          return;
        }
        requestAnimationFrame(wait);
      };
      requestAnimationFrame(wait);
    });
  });
}
function wireCopy(btn, getText) {
  btn.addEventListener('click', () => {
    if (!navigator.clipboard) {
      return;
    }
    navigator.clipboard.writeText(getText()).then(() => {
      btn.classList.add('done');
      setTimeout(() => {
        btn.classList.remove('done');
      }, 1400);
    }, () => {
      const r = document.createRange();
      r.selectNodeContents(btn.previousElementSibling);
      getSelection().removeAllRanges();
      getSelection().addRange(r);
    });
  });
}
async function slide(nodes, dir, fn) {
  if (reduce || !dir) {
    fn();
    return;
  }
  const out = dir > 0 ? 'out-l' : 'out-r';
  const inn = dir > 0 ? 'in-l' : 'in-r';
  nodes.forEach((n) => n.classList.add(out));
  await sleep(280);
  fn();
  nodes.forEach((n) => {
    n.classList.remove(out);
    n.classList.add(inn);
  });
  void nodes[0].offsetWidth;
  nodes.forEach((n) => n.classList.remove(inn));
}

wireCopy(document.querySelector('[data-copy-install]'), () => INSTALL);

/* Plate: topic pills pick the scene */
(function () {
  const TOPICS = [
    ['lesson-cache', 'Caching'],
    ['diffity-start', 'Getting started'],
    ['idea-tech-debt', 'Tech debt'],
    ['p:typingwise', 'Voice typing'],
    ['p:claude-queue', 'Overnight queue'],
    ['lesson-binary-search', 'Binary search'],
    ['how-rollback-tape', 'Rollbacks'],
    ['how-rate-bouncer', 'Rate limiting'],
    ['p:data structures in JS', 'Stacks'],
    ['how-debt-tower', 'Quick fix tower'],
  ];
  const stage = document.querySelector('[data-stage]');
  const pills = document.querySelector('[data-pills]');
  pills.innerHTML = TOPICS.map(([id, label]) => `<button type="button" aria-pressed="false"><span>${esc(label)}</span></button>`).join('');
  const btns = [...pills.children];
  let cur = -1, token = 0, auto = true;

  async function show(i, dir) {
    const t = ++token;
    cur = (i + TOPICS.length) % TOPICS.length;
    const id = TOPICS[cur][0];
    btns.forEach((b, k) => b.setAttribute('aria-pressed', 'false'));
    void pills.offsetWidth;
    await slide([stage], dir, () => {
      stage.replaceChildren(sc(id));
    });
    if (t !== token) {
      return;
    }
    const dur = ((window.STICK && window.STICK.SCENES[id] && window.STICK.SCENES[id].dur) || 5) * 1000 + 2400;
    pills.style.setProperty('--t', `${dur}ms`);
    btns[cur].setAttribute('aria-pressed', 'true');
    await sleep(600);
    if (t !== token) {
      return;
    }
    await playOnce(stage.firstChild);
    if (t !== token || !auto) {
      return;
    }
    await sleep(1500);
    if (t === token && auto) {
      show(cur + 1, 1);
    }
  }
  const pick = (k) => {
    auto = false;
    pills.classList.remove('auto');
    if (k !== cur) {
      show(k, k > cur ? 1 : -1);
      return;
    }
    playOnce(stage.firstChild);
  };
  btns.forEach((b, k) => b.addEventListener('click', () => pick(k)));
  let sx = null;
  stage.addEventListener('pointerdown', (e) => {
    sx = e.clientX;
  });
  stage.addEventListener('pointerup', (e) => {
    if (sx === null) {
      return;
    }
    const dx = e.clientX - sx;
    sx = null;
    if (Math.abs(dx) > 40) {
      pick((cur + (dx < 0 ? 1 : -1) + TOPICS.length) % TOPICS.length);
    }
  });
  show(0, 0);
})();

/* Viewer: an enlarged scene you can step through */
const viewer = (function () {
  const dlg = document.querySelector('[data-lb]');
  const stage = dlg.querySelector('[data-lb-stage]');
  const text = dlg.querySelector('[data-lb-text]');
  let list = [], cur = 0, token = 0;
  function render(id) {
    const m = byId[id];
    stage.replaceChildren(sc(id));
    dlg.querySelector('[data-lb-title]').textContent = m.title;
    dlg.querySelector('[data-lb-blurb]').textContent = m.blurb;
    dlg.querySelector('[data-lb-prompt]').textContent = promptFor(id);
    dlg.querySelector('[data-lb-cat]').textContent = catName[m.cat];
    dlg.querySelector('[data-lb-n]').textContent = `${cur + 1} / ${list.length}`;
  }
  async function go(i, dir) {
    const t = ++token;
    cur = (i + list.length) % list.length;
    await slide([stage, text], dir, () => render(list[cur]));
    await sleep(350);
    if (t === token && dlg.open) {
      playOnce(stage.firstChild);
    }
  }
  for (const b of dlg.querySelectorAll('[data-lb-prev]')) {
    b.addEventListener('click', () => go(cur - 1, -1));
  }
  for (const b of dlg.querySelectorAll('[data-lb-next]')) {
    b.addEventListener('click', () => go(cur + 1, 1));
  }
  dlg.querySelector('[data-lb-close]').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', (e) => {
    if (e.target === dlg) {
      dlg.close();
    }
  });
  dlg.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') {
      e.preventDefault();
      go(cur + 1, 1);
    }
    if (e.key === 'ArrowLeft') {
      e.preventDefault();
      go(cur - 1, -1);
    }
  });
  dlg.addEventListener('close', () => {
    token++;
    stage.replaceChildren();
  });
  let sx = null;
  stage.addEventListener('pointerdown', (e) => {
    sx = e.clientX;
  });
  stage.addEventListener('pointerup', (e) => {
    if (sx === null) {
      return;
    }
    const dx = e.clientX - sx;
    sx = null;
    if (Math.abs(dx) > 40) {
      go(cur + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
    }
  });
  wireCopy(dlg.querySelector('[data-lb-copy]'), () => `/stick-scene ${promptFor(list[cur])}`);
  return {
    open(ids, i) {
      list = ids;
      if (!dlg.open) {
        dlg.showModal();
      }
      go(i, 0);
    },
  };
})();

/* Examples grid */
(function () {
  const all = CATALOG.map((c) => c.id);
  const tabs = document.querySelector('[data-tabs]');
  const grid = document.querySelector('[data-grid]');
  const more = document.querySelector('[data-more]');
  const STEP = 12;
  let cat = 'all', open = false;
  document.querySelector('[data-total]').textContent = all.length;
  const cats = [{ id: 'all', name: 'All' }, ...window.CATEGORIES];
  tabs.innerHTML = cats.map((c) => `<button type="button" data-cat="${c.id}" aria-pressed="${c.id === 'all'}">${c.name}${c.id === 'all' ? '' : `<em>${all.filter((id) => byId[id].cat === c.id).length}</em>`}</button>`).join('');
  function render() {
    const list = cat === 'all' ? all : all.filter((id) => byId[id].cat === cat);
    const shown = open ? list : list.slice(0, STEP);
    grid.innerHTML = shown.map((id) => `<button type="button" class="cell" data-id="${esc(id)}" aria-label="Open ${esc(byId[id].title)}"><div class="f"><stick-scene scene="${esc(id)}" play="idle" no-floor></stick-scene></div><b>${esc(byId[id].title)}</b><code>${esc(promptFor(id))}</code></button>`).join('');
    more.hidden = list.length <= STEP || open;
    more.textContent = `Show all ${list.length}`;
    [...grid.children].forEach((c, i) => {
      const el = c.querySelector('stick-scene');
      c.addEventListener('pointerenter', () => {
        if (el.v) {
          el.v.hover = true;
          el.v.play();
        }
      });
      c.addEventListener('pointerleave', () => {
        if (el.v) {
          el.v.hover = false;
        }
      });
      c.addEventListener('click', () => viewer.open(list, i));
    });
  }
  for (const b of tabs.children) {
    b.addEventListener('click', () => {
      cat = b.dataset.cat;
      open = false;
      for (const x of tabs.children) {
        x.setAttribute('aria-pressed', String(x === b));
      }
      render();
    });
  }
  more.addEventListener('click', () => {
    open = true;
    render();
  });
  render();
})();
</script>
