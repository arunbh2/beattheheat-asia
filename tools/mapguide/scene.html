<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How to read the heat map</title>
<!-- The map guide film as one page. A drawn, faceless guide walks through real pictures of the heat map
     (shots/, captured by capture.js). window.tick(ms) moves everything to that moment, so render.js can seek
     frame by frame. It lays itself out for a tall (9:16) or a wide (16:9) window. -->
<style>
@font-face { font-family: Anton; src: url(../films/fonts/Anton-Regular.ttf); }
@font-face { font-family: Hanken; src: url(../films/fonts/HankenGrotesk-Medium.ttf); font-weight: 500; }
@font-face { font-family: Hanken; src: url(../films/fonts/HankenGrotesk-Bold.ttf); font-weight: 700; }
:root { --ink: #16202B; --cream: #FAF7F2; --sand: #F6E7D7; --orange: #F26430; --ember: #B8401A; --green: #1F7A4D; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--cream); }
body { font-family: Hanken, sans-serif; color: var(--ink); }
#head { position: absolute; }
#head .brand { display: flex; align-items: center; gap: .4em; font-family: Anton; letter-spacing: .04em; color: var(--ember); text-transform: uppercase; }
#head .brand i { display: inline-block; width: .9em; height: .9em; border-radius: 50%; background: var(--orange); }
#head h1 { font-family: Anton; font-weight: 400; text-transform: uppercase; line-height: 1; margin-top: .25em; }
#frame { position: absolute; z-index: 1; overflow: hidden; border-radius: 28px; background: #F7E6DA; box-shadow: 0 10px 40px rgba(22,32,43,.16); }
#frame img.shot { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform, opacity; }
#pointer { position: absolute; z-index: 5; width: 0; height: 0; }
#pointer .dot { position: absolute; left: -19px; top: -19px; width: 38px; height: 38px; border-radius: 50%; background: var(--orange); border: 5px solid #fff; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
#pointer .ring { position: absolute; left: -19px; top: -19px; width: 38px; height: 38px; border-radius: 50%; border: 5px solid var(--orange); }
#card { position: absolute; z-index: 6; overflow: hidden; border-radius: 22px; background: #fff; box-shadow: 0 16px 50px rgba(22,32,43,.28); }
#card img { position: absolute; left: 0; top: 0; width: 100%; opacity: 0; }
#cap { position: absolute; font-weight: 700; line-height: 1.2; }
#cap .line { position: absolute; left: 0; right: 0; top: 0; }
#guide { position: absolute; overflow: visible; }
#guide g { fill: none; stroke: var(--ink); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
#guide .stick, #guide .hat { stroke: var(--orange); stroke-width: 9; }
#bar { position: absolute; height: 8px; border-radius: 4px; background: rgba(22,32,43,.12); overflow: hidden; }
#bar i { display: block; height: 100%; width: 0; background: var(--orange); }
#close { position: absolute; z-index: 10; inset: 0; background: var(--ink); color: var(--cream); opacity: 0; }
#close .l { position: absolute; left: 0; right: 0; text-align: center; font-family: Anton; text-transform: uppercase; line-height: 1.05; }
#close .l.url { color: var(--orange); font-family: Hanken; font-weight: 700; text-transform: none; }
#close .l.note { font-family: Hanken; font-weight: 500; text-transform: none; color: var(--sand); }
</style>
</head>
<body>
<div id="head"><div class="brand"><i></i>Common Shade</div><h1>How to read the heat map</h1></div>
<div id="frame">
  <img class="shot" data-shot="web" src="shots/web.jpg" alt="">
  <img class="shot" data-shot="power" src="shots/power.jpg" alt="">
  <img class="shot" data-shot="loop" src="shots/loop.jpg" alt="">
  <img class="shot" data-shot="lever" src="shots/lever.jpg" alt="">
  <img class="shot" data-shot="package" src="shots/package.jpg" alt="">
  <div id="pointer"><div class="ring"></div><div class="dot"></div></div>
  <div id="card"><img data-card="power" src="shots/power-panel.jpg" alt=""><img data-card="lever" src="shots/lever-panel.jpg" alt=""></div>
</div>
<div id="cap"></div>
<svg id="guide" viewBox="0 0 300 560" aria-hidden="true"><g>
  <circle id="g-head" cx="150" cy="86" r="38"/>
  <path id="g-hat" class="hat" d=""/>
  <path id="g-body" d="M150 124 V330"/>
  <path id="g-legs" d="M150 330 L112 530 M150 330 L188 530"/>
  <path id="g-arm2" d=""/>
  <path id="g-arm" d=""/>
  <path id="g-stick" class="stick" d=""/>
</g></svg>
<div id="bar"><i></i></div>
<div id="close"></div>
<script>
"use strict";
(() => {
  const W = innerWidth, H = innerHeight, TALL = H > W;
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  // timing (from narrate.py) and words (from build.js) are passed in by render.js; these stand-ins let the page preview
  const T = window.T || { total: 80, scenes: [0, 6, 20.5, 28.4, 36.3, 46.4, 57.2, 69.9].map((s, i, a) => ({ start: s, dur: (a[i + 1] || 80) - s, beats: [0.6, 3, 5.5, 8] })) };
  const CAPS = window.CAPS || T.scenes.map(() => ["", "", "", ""]);
  const P = window.POINTS || {};
  const sm = x => { x = Math.min(1, Math.max(0, x)); return x * x * x * (x * (x * 6 - 15) + 10); };   // smootherstep
  const lerp = (a, b, k) => a + (b - a) * k;
  const at = (s, b = 0) => T.scenes[s].start + (T.scenes[s].beats[b] != null ? T.scenes[s].beats[b] : 0);
  const end = s => T.scenes[s].start + T.scenes[s].dur;

  // ---------- layout ----------
  const L = TALL
    ? { head: [60, 70, 34, 76], frame: [40, 250, W - 80, 1000], cap: [400, 1330, W - 400 - 50, 60], guide: [40, 1262, 316, 590], bar: [60, H - 44, W - 120], card: [0.47, 0.06, 0.5, 0.88] }
    : { head: [1120, 70, 30, 64], frame: [60, 60, 1000, H - 120], cap: [1120, 300, W - 1120 - 70, 46], guide: [1560, 560, 270, 504], bar: [1120, H - 66, W - 1120 - 70], card: [0.5, 0.05, 0.47, 0.9] };
  const place = (el, x, y, w, h) => Object.assign(el.style, { left: x + "px", top: y + "px", width: w != null ? w + "px" : "", height: h != null ? h + "px" : "" });
  place($("#head"), L.head[0], L.head[1]); $("#head .brand").style.fontSize = L.head[2] + "px"; $("#head h1").style.fontSize = L.head[3] + "px";
  if (!TALL) $("#head h1").style.maxWidth = (W - 1120 - 60) + "px";
  const [FX, FY, FW, FH] = L.frame; place($("#frame"), FX, FY, FW, FH);
  place($("#cap"), L.cap[0], L.cap[1], L.cap[2]); $("#cap").style.fontSize = L.cap[3] + "px";
  place($("#guide"), L.guide[0], L.guide[1], L.guide[2], L.guide[3]);
  place($("#bar"), L.bar[0], L.bar[1], L.bar[2]);
  place($("#card"), FW * L.card[0], FH * L.card[1], FW * L.card[2], FH * L.card[3]);

  // ---------- the shots and the camera ----------
  // a camera is [cx, cy, zoom]: the picture's point (as fractions) held at the frame's centre, and how far in
  const shots = {}; $$("img.shot").forEach(i => shots[i.dataset.shot] = i);
  const SH = {};
  const fit = name => { const i = shots[name]; const r = i.naturalHeight / i.naturalWidth || 0.96; const base = Math.max(FW, FH / r); return { base, r }; };
  function camXform(name, cam) {
    const { base, r } = SH[name] || (SH[name] = fit(name)), w = base * cam[2], h = w * r;
    let x = FW / 2 - cam[0] * w, y = FH / 2 - cam[1] * h;
    x = Math.min(0, Math.max(FW - w, x)); y = Math.min(0, Math.max(FH - h, y));   // never show past the picture's edge
    return { x, y, w, h };
  }
  // the plan, scene by scene: which shot, the camera at the start and end, where the pointer goes on each beat
  const pt = (shot, id) => (P[shot] && P[shot][id]) || [0.5, 0.5];
  const PLAN = [
    { shot: "web", cam: [[0.5, 0.5, 2.6], [0.5, 0.5, 1.0]], ease: [0, 1] },
    { shot: "web", cam: [[0.5, 0.5, 1.0], [0.5, 0.5, 1.06]], point: [null, ["web", "heat"], ["web", "scarcity"], ["web", "deaths"]] },
    { shot: "web", cam: [[0.5, 0.5, 1.06], [0.8, 0.55, 1.7]], point: [["web", "power"]], cut: { beat: 1, shot: "power", cam: [[0.5, 0.48, 1.0], [0.5, 0.5, 1.06]],
      point: [null, ["power", "power"], ["power", "generators"]] } },
    { shot: "power", cam: [[0.5, 0.5, 1.06], [0.42, 0.5, 1.12]], card: "power" },
    { shot: "loop", cam: [[0.49, 0.5, 1.0], [0.49, 0.5, 1.1]], point: [["loop", "demand"], ["loop", "uhi"], ["loop", "demand"]] },
    { shot: "lever", cam: [[0.45, 0.5, 1.0], [0.42, 0.5, 1.08]], point: [["lever", "lever:greencity"], null], card: "lever", cardBeat: 1 },
    { shot: "package", cam: [[0.5, 0.5, 1.0], [0.55, 0.55, 1.12]], point: [["package", "sleepless"], ["package", "uhi"]] },
    { shot: "package", cam: [[0.55, 0.55, 1.12], [0.55, 0.55, 1.2]], close: true },
  ];

  // ---------- the guide (faceless line drawing) ----------
  const SHX = 150, SHY = 160;                          // the shoulder, in the guide's own 300 × 560 box
  const gScale = L.guide[3] / 560;
  function drawGuide(t, target, talking) {
    // target: a point on screen, or null (arm at rest)
    const bob = talking ? Math.sin(t * 7.5) * 3 : 0, sway = Math.sin(t * 1.3) * 2;
    const hx0 = 150 + sway * 0.6, hy0 = 86 + bob;
    $("#g-head").setAttribute("cy", hy0); $("#g-head").setAttribute("cx", hx0);
    // a wide sun hat: the guide's only mark (no face, by design)
    $("#g-hat").setAttribute("d", `M${hx0 - 66} ${hy0 - 22} Q${hx0} ${hy0 - 40} ${hx0 + 66} ${hy0 - 22} M${hx0 - 32} ${hy0 - 30} Q${hx0 - 30} ${hy0 - 66} ${hx0} ${hy0 - 66} Q${hx0 + 30} ${hy0 - 66} ${hx0 + 32} ${hy0 - 30}`);
    $("#g-body").setAttribute("d", `M${150 + sway * 0.4} ${124 + bob} V330`);
    let ang;                                            // angle of the pointing arm, in screen space
    if (target) {
      const sx = L.guide[0] + SHX * gScale, sy = L.guide[1] + SHY * gScale;
      ang = Math.atan2(target[1] - sy, target[0] - sx);
      // keep the arm clear of the head: never steeper than 50 degrees above level
      if (ang < 0 && ang > -Math.PI / 2) ang = Math.max(ang, -Math.PI * 50 / 180);          // up and to the right
      else if (ang <= -Math.PI / 2) ang = Math.min(ang, -Math.PI * 130 / 180);              // up and to the left
    } else ang = Math.PI * (TALL ? 0.62 : 0.4) + Math.sin(t * 1.1) * 0.05;
    const ex = SHX + Math.cos(ang) * 82, ey = SHY + bob + Math.sin(ang) * 82;
    const hx = SHX + Math.cos(ang) * 150, hy = SHY + bob + Math.sin(ang) * 150;
    $("#g-arm").setAttribute("d", `M${SHX} ${SHY + bob} L${ex.toFixed(1)} ${(ey + 6).toFixed(1)} L${hx.toFixed(1)} ${hy.toFixed(1)}`);
    const st = target ? 1 : 0;
    $("#g-stick").setAttribute("d", st ? `M${hx.toFixed(1)} ${hy.toFixed(1)} L${(hx + Math.cos(ang) * 90).toFixed(1)} ${(hy + Math.sin(ang) * 90).toFixed(1)}` : "");
    const other = TALL ? Math.PI * 0.62 : Math.PI * 0.38;
    $("#g-arm2").setAttribute("d", `M${SHX} ${SHY + bob} L${(SHX - Math.cos(other) * 70).toFixed(1)} ${(SHY + 70 + bob).toFixed(1)} L${(SHX - Math.cos(other) * 60 + sway).toFixed(1)} ${(SHY + 150 + bob).toFixed(1)}`);
  }

  // ---------- captions ----------
  const capEl = $("#cap");
  function caption(t) {
    let s = T.scenes.findIndex((x, i) => t >= x.start && t < end(i)); if (s < 0) s = T.scenes.length - 1;
    const beats = T.scenes[s].beats; let b = 0; beats.forEach((x, i) => { if (t >= T.scenes[s].start + x - 0.15) b = i; });
    const text = (CAPS[s] || [])[b] || "", key = s + ":" + b;
    if (capEl.dataset.key !== key) { capEl.dataset.key = key; capEl.innerHTML = `<div class="line"></div>`; capEl.firstChild.textContent = text; }
    const since = t - (T.scenes[s].start + beats[b] - 0.15);
    capEl.style.opacity = PLAN[s].close ? 0 : sm(since / 0.25);
    capEl.style.transform = `translateY(${(1 - sm(since / 0.3)) * 14}px)`;
  }

  // ---------- the closing card ----------
  const close = $("#close"), CL = 7;
  function closeCard(t) {
    const s = T.scenes[CL], k = sm((t - s.start + 0.2) / 0.6);
    close.style.opacity = k;
    if (!close.dataset.built) {
      close.dataset.built = 1;
      const lines = (CAPS[CL] || []).slice();
      const fs = TALL ? [92, 92, 92, 54] : [78, 78, 78, 46], gap = TALL ? 130 : 108, top0 = TALL ? 640 : 250;
      lines.forEach((txt, i) => { const d = document.createElement("div"); d.className = "l" + (i === lines.length - 1 ? " url" : ""); d.style.fontSize = fs[i] + "px"; d.style.top = (top0 + i * gap + (i === lines.length - 1 ? 40 : 0)) + "px"; d.textContent = txt; close.appendChild(d); });
      const note = document.createElement("div"); note.className = "l note"; note.style.fontSize = (TALL ? 34 : 28) + "px"; note.style.top = (top0 + lines.length * gap + (TALL ? 90 : 60)) + "px";
      note.textContent = "Free and open. Common Shade, first published as BeatTheHeat.Asia"; close.appendChild(note);
    }
    [...close.children].forEach((el, i) => { const b = i < s.beats.length ? s.beats[i] : s.beats[s.beats.length - 1] + 1.2; const kk = sm((t - s.start - b + 0.2) / 0.45); el.style.opacity = kk; el.style.transform = `translateY(${(1 - kk) * 22}px)`; });
  }

  // ---------- one frame ----------
  window.tick = ms => {
    const t = ms / 1000;
    let s = T.scenes.findIndex((x, i) => t >= x.start && t < end(i)); if (s < 0) s = T.scenes.length - 1;
    const sc = T.scenes[s], pl = PLAN[s], k = (t - sc.start) / sc.dur;
    // which shot, which camera
    let shot = pl.shot, cam, pts = pl.point || [], beatBase = 0;
    if (pl.cut && t >= at(s, pl.cut.beat)) {
      const kk = (t - at(s, pl.cut.beat)) / (end(s) - at(s, pl.cut.beat));
      shot = pl.cut.shot; cam = pl.cut.cam[0].map((v, i) => lerp(v, pl.cut.cam[1][i], sm(kk)));
      pts = pl.cut.point;
    } else {
      const span = pl.cut ? (at(s, pl.cut.beat) - sc.start) / sc.dur : 1;
      cam = pl.cam[0].map((v, i) => lerp(v, pl.cam[1][i], sm(k / span)));
    }
    // cross-fade 0.5 s from the previous scene's last shot
    const prev = s > 0 ? (PLAN[s - 1].cut ? PLAN[s - 1].cut.shot : PLAN[s - 1].shot) : null;
    const fadeK = prev && prev !== pl.shot ? sm((t - sc.start) / 0.5) : 1;
    const cutFade = pl.cut && t >= at(s, pl.cut.beat) ? sm((t - at(s, pl.cut.beat)) / 0.45) : null;
    for (const [name, img] of Object.entries(shots)) {
      let o = 0;
      if (cutFade != null) o = name === pl.cut.shot ? cutFade : name === pl.shot ? 1 - cutFade : 0;
      else if (name === shot) o = fadeK;
      else if (name === prev && fadeK < 1) o = 1;
      img.style.opacity = o; img.style.zIndex = name === shot ? 2 : 1;
      if (o > 0) {
        const c = name === shot ? cam : (pl.cut && name === pl.shot ? pl.cam[1] : (PLAN[s - 1] ? (PLAN[s - 1].cut ? PLAN[s - 1].cut.cam[1] : PLAN[s - 1].cam[1]) : cam));
        const x = camXform(name, c); Object.assign(img.style, { width: x.w + "px", height: x.h + "px", transform: `translate(${x.x}px, ${x.y}px)` });
      }
    }
    // the pointer: glides to each beat's dot, with a tap ring as it lands
    const beats = sc.beats; let b = 0; beats.forEach((x, i) => { if (t >= sc.start + x) b = i; });
    const tgt = pts[Math.min(b, pts.length - 1)];
    const ptr = $("#pointer");
    let screen = null;
    if (tgt && !pl.close) {
      const x = camXform(tgt[0], cam), p = pt(tgt[0], tgt[1]);
      let px = x.x + p[0] * x.w, py = x.y + p[1] * x.h;
      const prevT = b > 0 ? pts[Math.min(b - 1, pts.length - 1)] : null;
      if (prevT && prevT[0] === tgt[0]) {
        const q = pt(prevT[0], prevT[1]); const g = sm((t - sc.start - beats[b]) / 0.7);
        px = lerp(x.x + q[0] * x.w, px, g); py = lerp(x.y + q[1] * x.h, py, g);
      }
      const show = sm((t - sc.start - (prevT ? 0 : beats[b])) / 0.35);
      ptr.style.left = px + "px"; ptr.style.top = py + "px"; ptr.style.opacity = show;
      const tap = (t - sc.start - beats[b] - (prevT && prevT[0] === tgt[0] ? 0.7 : 0.2));
      const ring = ptr.firstElementChild, rk = tap > 0 && tap < 0.9 ? tap / 0.9 : (tap >= 0.9 ? 1 : 0);
      ring.style.transform = `scale(${1 + rk * 2.6})`; ring.style.opacity = tap > 0 ? 1 - rk : 0;
      screen = [FX + px, FY + py];
    } else ptr.style.opacity = 0;
    // the card (the map's side panel) slides up
    const card = $("#card");
    if (pl.card) {
      const from = at(s, pl.cardBeat || 0) + (pl.cardBeat ? 0 : 0.3), kk = sm((t - from) / 0.6);
      card.style.opacity = kk; card.style.transform = `translateY(${(1 - kk) * 60}px)`;
      $$("#card img").forEach(i => i.style.opacity = i.dataset.card === pl.card ? 1 : 0);
      const img = $(`#card img[data-card="${pl.card}"]`), scroll = Math.max(0, (img.offsetHeight - card.offsetHeight)) * sm((t - from - 1.5) / Math.max(1, end(s) - from - 2.5)) * 0.35;
      img.style.transform = `translateY(${-scroll}px)`;
      if (!screen) screen = [FX + FW * (L.card[0] + 0.05), FY + FH * (L.card[1] + 0.2)];
    } else { card.style.opacity = 0; }
    // the guide points at whatever is being shown
    const talking = beats.some((x, i) => { const st = sc.start + x; return t > st && t < st + 2.2; });
    drawGuide(t, pl.close ? null : screen, talking);
    $("#guide g").style.stroke = "";
    caption(t);
    // closing card and progress bar
    if (pl.close) closeCard(t); else close.style.opacity = 0;
    $("#bar i").style.width = (100 * t / T.total).toFixed(2) + "%";
    $("#bar").style.opacity = pl.close ? 0 : 1;
  };
  window.ready = Promise.all([document.fonts.ready, ...Object.values(shots).map(i => i.decode().catch(() => {})), ...$$("#card img").map(i => i.decode().catch(() => {}))]).then(() => { window.tick(0); });
})();
</script>
</body>
</html>
