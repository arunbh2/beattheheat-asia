<!doctype html>
<!-- The share card: the editable source of images/share-systems-map.jpg (1200 x 630). render.js fills MAP_SRC with a
     capture of the real systems map and renders this page. Change the words here, then run render.js. -->
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@500;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; }
  .card { width: 1200px; height: 630px; box-sizing: border-box; position: relative; overflow: hidden; background: #FAF7F2; color: #16202B; font-family: "Hanken Grotesk", Arial, sans-serif; }
  .words { position: absolute; left: 64px; top: 56px; width: 470px; bottom: 52px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font-family: Anton, Impact, sans-serif; font-size: 30px; letter-spacing: .02em; }
  .brand svg { width: 52px; height: 40px; }
  h1 { font-family: Anton, Impact, sans-serif; font-weight: 400; text-transform: uppercase; font-size: 76px; line-height: 1.02; margin: 54px 0 0; letter-spacing: .005em; }
  h1 span { color: #F26430; }
  p { font-size: 25px; line-height: 1.38; font-weight: 500; margin: 24px 0 0; color: #3F4650; }
  .url { margin-top: auto; font-size: 22px; font-weight: 700; color: #16202B; }
  .map { position: absolute; left: 530px; top: -25px; width: 680px; height: 680px; }
  .map img { width: 100%; height: 100%; display: block; }
</style></head>
<body><div class="card" id="card">
  <div class="words">
    <div class="brand"><svg viewBox="0 0 26 20" aria-hidden="true"><path d="M2.5 8 Q13 -1 23.5 8" fill="none" stroke="#F26430" stroke-width="4" stroke-linecap="round"/><path d="M6.5 7 V18.5 M19.5 7 V18.5" stroke="#16202B" stroke-width="2.4" stroke-linecap="round"/></svg>COMMON SHADE</div>
    <h1>How heat <span>connects</span> our lives</h1>
    <p>Health, work, water, power and care, on one free, sourced map of extreme heat in South and Southeast Asia.</p>
    <div class="url">beattheheat.asia</div>
  </div>
  <div class="map"><img src="MAP_SRC" alt=""></div>
</div></body></html>
