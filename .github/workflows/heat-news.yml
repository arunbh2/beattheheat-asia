# Refreshes feeds/news.json (heat headlines from South and Southeast Asia, via regional news outlets' RSS feeds and the GDELT Project) every six hours.
# Also refreshes feeds/research.json, a snapshot of new research from Europe PMC (the page's fallback).
# The site reads the file from raw.githubusercontent.com, so a new headline shows without a site rebuild.
# Every item is also kept in feeds/archive.json and listed on /sources/, so nothing cited disappears when it rolls off the feed.
name: Heat news feed
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: heat-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node tools/fetch-news.js
      - run: node tools/fetch-research.js
      - run: node tools/archive-news.js
      - run: node tools/news-status.js
      - name: Rebuild the sources page with the archive (with its explainer film and agent head block, as build-static.js adds them)
        run: node tools/build-sources.js && node tools/build-nav.js && node tools/shorts/embed.js && node tools/explainers/embed.js && node tools/build-agent-files.js
      - name: Commit the feed if it changed
        run: |
          if git diff --quiet -- feeds sources && [ -z "$(git ls-files --others --exclude-standard feeds)" ]; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/ sources/
          git commit -m "Refresh heat news feed"
          git push
