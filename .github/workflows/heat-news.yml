# Refreshes feeds/news.json (heat headlines from South and Southeast Asia, via the GDELT Project and Google News) every six hours.
# The site reads the file from raw.githubusercontent.com, so a new headline shows without a site rebuild.
name: Heat news feed
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: heat-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/fetch-news.js
      - name: Commit the feed if it changed
        run: |
          if git diff --quiet -- feeds/news.json; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/news.json
          git commit -m "Refresh heat news feed"
          git push
