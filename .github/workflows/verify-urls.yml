# Checks a list of source links and finds or saves an archived copy of each (tools/verify-urls.js), then commits the
# results back to the branch it ran on. Used before a new research set is published (for example risk finance).
name: Verify links and archives
on:
  workflow_dispatch:
    inputs:
      list:
        description: File with one link per line
        required: true
      out:
        description: Where to write the results (JSON)
        required: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/verify-urls.js "${{ inputs.list }}" "${{ inputs.out }}"
      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.out }}"
          git diff --cached --quiet || git commit -m "Link check and archives: ${{ inputs.out }}"
          git pull --rebase --autostash && git push
