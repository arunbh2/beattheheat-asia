# Checks outside links from new research before it is added to the site (see tools/check-links.js). Run by hand.
name: Check links
on:
  workflow_dispatch:
    inputs:
      list:
        description: File with one link per line
        default: research/urls-to-check.txt
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            research
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-links.js "${{ inputs.list }}"
