# Checks outside links from new research before it is added to the site (see tools/check-links.js). Run by hand.
name: Check links
on:
  workflow_dispatch:
    inputs:
      list:
        description: File with one link per line
        default: research/urls-to-check.txt
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            tools
            research
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # inputs reach the shell as variables, never as script text, and are checked before use
      - run: |
          case "$LIST" in /*|*..*|"") echo "::error::list must be a path inside the repository, without .."; exit 1;; esac
          [[ "$LIST" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "::error::list may use only letters, digits, . _ / -"; exit 1; }
          node tools/check-links.js "$LIST"
        env:
          LIST: ${{ inputs.list }}
