name: Check the knowledge base
on:
  push:
    paths: ["data/**", "tools/living-evidence/**", "tools/hap-archive.js", "tools/check-hap-archive.js", "research/india-hap-archive/**", "tools/build-data.js", "tools/check-data.js", "tools/check-voice.js", "data.js", "**/*.html", "**/*.css", "script.js", "tools/site-nav.js", "tools/check-stripes.js", "tools/stripe-rules.js", "tools/check-cards.js", "tools/card-rules.js", "tools/check-type.js", "tools/type-rules.js", ".github/workflows/check-data.yml"]
  pull_request:
    paths: ["data/**", "tools/living-evidence/**", "tools/hap-archive.js", "tools/check-hap-archive.js", "research/india-hap-archive/**", "tools/build-data.js", "tools/check-data.js", "tools/check-voice.js", "data.js", "**/*.html", "**/*.css", "script.js", "tools/site-nav.js", "tools/check-stripes.js", "tools/stripe-rules.js", "tools/check-cards.js", "tools/card-rules.js", "tools/check-type.js", "tools/type-rules.js", ".github/workflows/check-data.yml"]
# the check only reads: pull requests and pushes get a read-only token, not written into the checkout
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20 }
      - name: data.js matches data/core
        run: node tools/build-data.js --check
      - name: every record follows the rules
        run: node tools/check-data.js
      - name: no page speaks in an instructing voice
        run: node tools/check-voice.js
      - name: the weekly evidence review queue is complete where accepted
        run: node tools/living-evidence/check.js
      - name: no accent stripes down one edge of cards or notes
        run: node tools/check-stripes.js
      - name: cards, notes and panels keep to the shared corners, surfaces and flat cards
        run: node tools/check-cards.js
      - name: type keeps to the scale and the 12px floor
        run: node tools/check-type.js
