name: Check the knowledge base
on:
  push:
    paths: ["data/**", "tools/living-evidence/**", "tools/hap-archive.js", "tools/check-hap-archive.js", "research/india-hap-archive/**", "tools/build-data.js", "tools/check-data.js", "tools/check-voice.js", "data.js", "**/*.html", "**/*.css", "script.js", "tools/site-nav.js", "tools/check-stripes.js", "tools/stripe-rules.js", "tools/check-cards.js", "tools/card-rules.js", "tools/check-type.js", "tools/type-rules.js", "tools/check-colours.js", "tools/colour-rules.js", "tools/checks.js", "tools/check-*.js", "tools/signals-sync.js", "package.json", ".github/workflows/check-data.yml"]
  pull_request:
    paths: ["data/**", "tools/living-evidence/**", "tools/hap-archive.js", "tools/check-hap-archive.js", "research/india-hap-archive/**", "tools/build-data.js", "tools/check-data.js", "tools/check-voice.js", "data.js", "**/*.html", "**/*.css", "script.js", "tools/site-nav.js", "tools/check-stripes.js", "tools/stripe-rules.js", "tools/check-cards.js", "tools/card-rules.js", "tools/check-type.js", "tools/type-rules.js", "tools/check-colours.js", "tools/colour-rules.js", "tools/checks.js", "tools/check-*.js", "tools/signals-sync.js", "package.json", ".github/workflows/check-data.yml"]
# the check only reads: pull requests and pushes get a read-only token, not written into the checkout
permissions:
  contents: read
# a newer push to the same branch cancels the older run
concurrency:
  group: check-data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      # every check in tools/checks.js except the three browser checks (contrast, targets, site), which run locally;
      # each check gets its own folded log group, failures and notes become annotations, and the run summary has a table
      - name: Every check except the browser ones (node tools/check-all.js --fast)
        run: node tools/check-all.js --fast
