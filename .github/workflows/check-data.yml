name: Check the knowledge base
# every push and pull request: the run takes about half a minute, and with no path filter a required check is never
# left pending by a change the filter skipped. Commits the bots push with GITHUB_TOKEN start no workflow, so the news,
# source-check and harvest commits add no runs.
on:
  push:
  pull_request:
# the check only reads: pull requests and pushes get a read-only token, not written into the checkout
permissions:
  contents: read
# a newer push to the same branch cancels the older run
concurrency:
  group: check-data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      # every check in tools/checks.js except the three browser checks (contrast, targets, site), which run locally;
      # each check gets its own folded log group, failures and notes become annotations, and the run summary has a table
      - name: Every check except the browser ones (node tools/check-all.js --fast)
        run: node tools/check-all.js --fast
