# Looks up publication dates for sources whose records carry none (tools/fetch-dates.js): Crossref by DOI, then the page's
# own metadata, then the earliest Wayback Machine copy ("online by"). Commits research/growth/fetched-dates.json back to
# the branch it ran on; tools/growth-dates.js reads it at the next build. Runs by hand, or when undated.txt changes.
name: Date sources
on:
  workflow_dispatch:
  push:
    paths:
      - research/growth/undated.txt
      - tools/fetch-dates.js
permissions:
  contents: write
concurrency:
  group: date-sources-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dates:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node tools/fetch-dates.js
      - name: Commit the results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/growth/fetched-dates.json
          git diff --cached --quiet || git commit -m "Date sources: publication dates looked up"
          git pull --rebase --autostash || true
          git push
